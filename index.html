<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-950 text-white min-h-screen font-inter">
    <nav id="navbar" class="fixed top-0 w-full z-50 bg-gray-950/80 backdrop-blur-xl border-b border-white/5 transition-all">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" onclick="navigateTo('home')" class="flex items-center gap-2 text-xl font-bold">
                <span class="text-red-500">Stream</span><span>Hub</span>
            </a>
            <div class="flex-1 max-w-xl mx-8">
                <div class="relative">
                    <input id="searchInput" type="text" placeholder="Search movies, series, anime..."
                        class="w-full bg-gray-900 border border-gray-800 rounded-full px-5 py-2.5 text-sm focus:outline-none focus:border-red-500/50 focus:ring-1 focus:ring-red-500/30 transition-all placeholder-gray-500">
                    <button onclick="performSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <select id="sourceSelect" class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500/50">
                    <option value="">All Sources</option>
                </select>
                <button onclick="toggleLanguage()" id="langBtn" class="px-3 py-1.5 bg-gray-900 border border-gray-800 rounded-lg text-sm hover:border-red-500/50 transition">
                    AR
                </button>
            </div>
        </div>
    </nav>

    <main id="app" class="pt-20 min-h-screen"></main>

    <div id="loading" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="flex flex-col items-center gap-4">
            <div class="w-10 h-10 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-400 text-sm" data-i18n="loading">Loading...</p>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
